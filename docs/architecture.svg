<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="100%" style="font-family:var(--font-sans, sans-serif)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill:var(--color-background-secondary); stroke:var(--color-border-primary); stroke-width:0.5px; rx:8; }
      .box-title { font-size:13px; font-weight:500; fill:var(--color-text-primary); }
      .box-sub { font-size:11px; fill:var(--color-text-secondary); }
      .conn { stroke:var(--color-border-secondary); stroke-width:0.5px; marker-end:url(#arrow); fill:none; }
      .conn-plain { stroke:var(--color-border-secondary); stroke-width:0.5px; fill:none; }
      .section-title { font-size:12px; font-weight:500; fill:var(--color-text-secondary); letter-spacing:0.5px; text-transform:uppercase; }
    </style>
  </defs>

  <!-- Section 1: 分层架构 (y=40 to y=230) -->
  <text x="40" y="56" class="section-title">① 整体分层架构</text>
  <line x1="40" y1="64" x2="640" y2="64" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

  <!-- 用户层 -->
  <rect x="240" y="80" width="200" height="44" class="box" stroke="var(--color-border-primary)"/>
  <text x="340" y="102" text-anchor="middle" dominant-baseline="central" class="box-title">用户层</text>
  <text x="340" y="118" text-anchor="middle" dominant-baseline="central" class="box-sub">微信小程序 WeChat Mini Program</text>

  <!-- 箭头：用户层 → 展示层 -->
  <line x1="340" y1="124" x2="340" y2="148" class="conn-plain"/>

  <!-- 展示层 -->
  <rect x="160" y="150" width="360" height="56" class="box"/>
  <text x="340" y="172" text-anchor="middle" dominant-baseline="central" class="box-title">展示层（13 个页面）</text>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" class="box-sub">S1 封面 → S2 认证 → S3 合规 → S4 空间 → W1–W9 评估</text>

  <!-- 箭头：展示层 → 逻辑层 -->
  <line x1="280" y1="206" x2="280" y2="236" class="conn-plain"/>
  <line x1="400" y1="206" x2="400" y2="236" class="conn-plain"/>

  <!-- 逻辑层 -->
  <rect x="100" y="238" width="180" height="56" class="box" stroke="var(--color-blue-600)" fill="var(--color-blue-50)"/>
  <text x="190" y="260" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-blue-800)">engine.js</text>
  <text x="190" y="278" text-anchor="middle" dominant-baseline="central" class="box-sub">四维决策引擎</text>

  <rect x="300" y="238" width="140" height="56" class="box" stroke="var(--color-teal-600)" fill="var(--color-teal-50)"/>
  <text x="370" y="260" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-teal-800)">rules.json</text>
  <text x="370" y="278" text-anchor="middle" dominant-baseline="central" class="box-sub">18 条结构化规则</text>

  <rect x="460" y="238" width="140" height="56" class="box"/>
  <text x="530" y="260" text-anchor="middle" dominant-baseline="central" class="box-title">trace.js</text>
  <text x="530" y="278" text-anchor="middle" dominant-baseline="central" class="box-sub">决策日志（未集成）</text>

  <!-- 箭头：逻辑层 → 数据层 -->
  <line x1="190" y1="294" x2="130" y2="324" class="conn-plain"/>
  <line x1="370" y1="294" x2="370" y2="324" class="conn-plain"/>
  <line x1="530" y1="294" x2="530" y2="324" class="conn-plain"/>

  <!-- 数据层 -->
  <rect x="60" y="326" width="160" height="44" class="box" stroke="var(--color-green-600)" fill="var(--color-green-50)"/>
  <text x="140" y="344" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-green-800)">POI 数据</text>
  <text x="140" y="360" text-anchor="middle" dominant-baseline="central" class="box-sub">腾讯地图 API</text>

  <rect x="240" y="326" width="160" height="44" class="box" stroke="var(--color-amber-600)" fill="var(--color-amber-50)"/>
  <text x="320" y="344" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-amber-800)">Mock 数据</text>
  <text x="320" y="360" text-anchor="middle" dominant-baseline="central" class="box-sub">本地模拟 mock-data.js</text>

  <rect x="420" y="326" width="160" height="44" class="box" stroke="var(--color-coral-600)" fill="var(--color-coral-50)"/>
  <text x="500" y="344" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-coral-800)">Manual 输入</text>
  <text x="500" y="360" text-anchor="middle" dominant-baseline="central" class="box-sub">用户手动填写</text>

  <!-- Section 2: 决策引擎架构 (y=390 to y=510) -->
  <text x="40" y="406" class="section-title">② 四维决策引擎</text>
  <line x1="40" y1="414" x2="640" y2="414" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

  <!-- 输入 -->
  <rect x="40" y="426" width="120" height="44" class="box"/>
  <text x="100" y="448" text-anchor="middle" dominant-baseline="central" class="box-title">地块输入</text>
  <text x="100" y="462" text-anchor="middle" dominant-baseline="central" class="box-sub">params</text>

  <!-- 箭头 -->
  <line x1="160" y1="448" x2="200" y2="448" class="conn"/>

  <!-- 四维评分 -->
  <rect x="202" y="426" width="100" height="44" class="box" stroke="var(--color-blue-600)" fill="var(--color-blue-50)"/>
  <text x="252" y="448" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-blue-800)">合规 35%</text>
  <text x="252" y="462" text-anchor="middle" dominant-baseline="central" class="box-sub">R001–R006</text>

  <rect x="312" y="426" width="100" height="44" class="box" stroke="var(--color-green-600)" fill="var(--color-green-50)"/>
  <text x="362" y="448" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-green-800)">空间 25%</text>
  <text x="362" y="462" text-anchor="middle" dominant-baseline="central" class="box-sub">R007–R010</text>

  <rect x="422" y="426" width="100" height="44" class="box" stroke="var(--color-amber-600)" fill="var(--color-amber-50)"/>
  <text x="472" y="448" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-amber-800)">经济 20%</text>
  <text x="472" y="462" text-anchor="middle" dominant-baseline="central" class="box-sub">R011–R014</text>

  <rect x="532" y="426" width="100" height="44" class="box" stroke="var(--color-purple-600)" fill="var(--color-purple-50)"/>
  <text x="582" y="448" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-purple-800)">市场 20%</text>
  <text x="582" y="462" text-anchor="middle" dominant-baseline="central" class="box-sub">R015–R018</text>

  <!-- 箭头 -->
  <line x1="632" y1="448" x2="668" y2="448" class="conn"/>

  <!-- 决策输出 -->
  <rect x="540" y="490" width="120" height="44" class="box" stroke="var(--color-red-600)" fill="var(--color-red-50)"/>
  <text x="600" y="508" text-anchor="middle" dominant-baseline="central" class="box-title" style="fill:var(--color-red-800)">决策输出</text>
  <text x="600" y="522" text-anchor="middle" dominant-baseline="central" class="box-sub">GO / PAUSE / NO-GO</text>

  <!-- 加权计算（备注） -->
  <text x="668" y="448" text-anchor="start" dominant-baseline="central" class="box-sub">加权</text>
  <line x1="632" y1="448" x2="668" y2="448" class="conn" transform="scale(-1,1) translate(-1336,0)"/>
  <line x1="600" y1="470" x2="600" y2="488" class="conn-plain" stroke-dasharray="2,2"/>

  <!-- Section 3: SOP 十步流程 (y=530 to y=600) -->
  <text x="40" y="546" class="section-title">③ SOP 十步流程</text>
  <line x1="40" y1="554" x2="640" y2="554" stroke="var(--color-border-tertiary)" stroke-width="0.5"/>

  <!-- 流程步骤（紧凑排列） -->
  <rect x="40" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="66" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">S1 输入</text>

  <rect x="102" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="128" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">S2 筛选</text>

  <rect x="164" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="190" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">S3 合规</text>

  <rect x="226" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="252" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">S4 空间</text>

  <rect x="288" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="314" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">W1–W3</text>

  <rect x="350" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="376" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">W4–W6</text>

  <rect x="412" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="438" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">W7 评分</text>

  <rect x="474" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="500" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">W8 建议</text>

  <rect x="536" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="562" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">W9 结果</text>

  <rect x="598" y="566" width="52" height="32" class="box" rx="6"/>
  <text x="624" y="582" text-anchor="middle" dominant-baseline="central" style="font-size:11px;font-weight:500;fill:var(--color-text-primary)">报告</text>

  <!-- 连接箭头 -->
  <line x1="92" y1="582" x2="100" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="154" y1="582" x2="162" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="216" y1="582" x2="224" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="278" y1="582" x2="286" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="340" y1="582" x2="348" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="402" y1="582" x2="410" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="464" y1="582" x2="472" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="526" y1="582" x2="534" y2="582" class="conn" stroke-width="0.8"/>
  <line x1="588" y1="582" x2="596" y2="582" class="conn" stroke-width="0.8"/>

</svg>
