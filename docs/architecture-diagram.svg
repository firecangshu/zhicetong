<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
  <title>踏歌行智策通系统架构图</title>
  <desc>展示踏歌行智策通系统的四层架构：用户交互层、业务逻辑层、数据层、外部接口层</desc>
  
  <style>
    .layer-title { font: 500 13px sans; fill: #444441; }
    .module-title { font: 500 12px sans; fill: #2C2C2A; }
    .module-desc { font: 400 11px sans; fill: #5F5E5A; }
    .arrow { stroke: #888780; stroke-width: 1.5; marker-end: url(#arrow); fill: none; }
    .dashed { stroke-dasharray: 4 3; }
  </style>
  
  <!-- 第1层：用户交互层 -->
  <rect x="40" y="20" width="600" height="100" rx="12" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="60" y="40" class="layer-title">用户交互层</text>
  
  <rect x="60" y="52" width="80" height="36" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="100" y="68" text-anchor="middle" dominant-baseline="central" class="module-title">S1-S4</text>
  <text x="100" y="82" text-anchor="middle" dominant-baseline="central" class="module-desc">封面/指南/介绍</text>
  
  <rect x="160" y="52" width="420" height="36" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="370" y="68" text-anchor="middle" dominant-baseline="central" class="module-title">W1-W10 SOP十步流程</text>
  <text x="370" y="82" text-anchor="middle" dominant-baseline="central" class="module-desc">身份认证→地块框选→资源调查→...→三向成果</text>
  
  <!-- 第2层：业务逻辑层 -->
  <rect x="40" y="140" width="600" height="120" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="60" y="160" class="layer-title">业务逻辑层</text>
  
  <rect x="60" y="172" width="160" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="140" y="190" text-anchor="middle" dominant-baseline="central" class="module-title">四维决策引擎</text>
  <text x="140" y="204" text-anchor="middle" dominant-baseline="central" class="module-desc">合规35%+空间25%</text>
  <text x="140" y="218" text-anchor="middle" dominant-baseline="central" class="module-desc">+经济20%+市场20%</text>
  
  <rect x="240" y="172" width="160" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="320" y="190" text-anchor="middle" dominant-baseline="central" class="module-title">SOP协议</text>
  <text x="320" y="204" text-anchor="middle" dominant-baseline="central" class="module-desc">标准化任务协议</text>
  <text x="320" y="218" text-anchor="middle" dominant-baseline="central" class="module-desc">我已核对确认机制</text>
  
  <rect x="420" y="172" width="160" height="56" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="500" y="190" text-anchor="middle" dominant-baseline="central" class="module-title">数据溯源体系</text>
  <text x="500" y="204" text-anchor="middle" dominant-baseline="central" class="module-desc">官方🟦+AI🟩+人工🟧</text>
  <text x="500" y="218" text-anchor="middle" dominant-baseline="central" class="module-desc">人机双层确权</text>
  
  <!-- 第3层：数据层 -->
  <rect x="40" y="280" width="600" height="100" rx="12" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="60" y="300" class="layer-title">数据层</text>
  
  <rect x="60" y="312" width="160" height="36" rx="8" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
  <text x="140" y="328" text-anchor="middle" dominant-baseline="central" class="module-title">Mock数据</text>
  <text x="140" y="342" text-anchor="middle" dominant-baseline="central" class="module-desc">预埋虚拟数据</text>
  
  <rect x="240" y="312" width="160" height="36" rx="8" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
  <text x="320" y="328" text-anchor="middle" dominant-baseline="central" class="module-title">规则配置</text>
  <text x="320" y="342" text-anchor="middle" dominant-baseline="central" class="module-desc">rules.json可配置</text>
  
  <rect x="420" y="312" width="160" height="36" rx="8" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
  <text x="500" y="328" text-anchor="middle" dominant-baseline="central" class="module-title">决策日志</text>
  <text x="500" y="342" text-anchor="middle" dominant-baseline="central" class="module-desc">trace.js经验沉淀</text>
  
  <!-- 第4层：外部接口层 -->
  <rect x="40" y="400" width="600" height="100" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="60" y="420" class="layer-title">外部接口层（预留）</text>
  
  <rect x="60" y="432" width="160" height="36" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="140" y="448" text-anchor="middle" dominant-baseline="central" class="module-title">腾讯地图API</text>
  <text x="140" y="462" text-anchor="middle" dominant-baseline="central" class="module-desc">POI+位置服务</text>
  
  <rect x="240" y="432" width="160" height="36" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="320" y="448" text-anchor="middle" dominant-baseline="central" class="module-title">混元LLM</text>
  <text x="320" y="462" text-anchor="middle" dominant-baseline="central" class="module-desc">云函数预留</text>
  
  <rect x="420" y="432" width="160" height="36" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text x="500" y="448" text-anchor="middle" dominant-baseline="central" class="module-title">政策API</text>
  <text x="500" y="462" text-anchor="middle" dominant-baseline="central" class="module-desc">政策数据接口</text>
  
  <!-- 连接箭头 -->
  <path d="M340 120 L340 140" class="arrow" stroke="#1D9E75"/>
  <path d="M340 260 L340 280" class="arrow" stroke="#D85A30"/>
  <path d="M340 380 L340 400" class="arrow dashed" stroke="#378ADD"/>
  
</svg>
