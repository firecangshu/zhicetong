adaptation_version: "1.0"
generated_at: "2026-06-11"
status: "partially_implemented"

# ======== 地块类型适配 ========
land_type_adaptation:
  name: "地块类型→权重自适应"
  description: "根据地块类型自动调整四维权重"
  current_status: "设计中"
  implementation: "utils/engine.js（硬编码权重，未实现动态调整）"

  scenarios:
    - type: "林地/生态型地块"
      condition: "resource.landType 含 '林地'"
      weight_adjustment:
        compliance: "0.40 (+0.05)"
        spatial: "0.30 (+0.05)"
        economic: "0.15 (-0.05)"
        market: "0.15 (-0.05)"
      reason: "生态敏感区域，合规和空间评估优先级更高"

    - type: "近郊休闲地块"
      condition: "market.position 含 '近郊'"
      weight_adjustment:
        compliance: "0.30 (-0.05)"
        spatial: "0.20 (-0.05)"
        economic: "0.25 (+0.05)"
        market: "0.25 (+0.05)"
      reason: "近郊项目市场竞争激烈，经济和市场评估更重要"

    - type: "历史文化遗产地块"
      condition: "resource.historicalSites 非空"
      weight_adjustment:
        compliance: "0.40 (+0.05)"
        spatial: "0.25 (+0.00)"
        economic: "0.15 (-0.05)"
        market: "0.20 (+0.00)"
      reason: "文保单位周边合规要求更严格"

    - type: "大型综合地块(>1000亩)"
      condition: "land.area 含 '1000' 或更大"
      weight_adjustment:
        compliance: "0.35 (+0.00)"
        spatial: "0.25 (+0.00)"
        economic: "0.25 (+0.05)"
        market: "0.15 (-0.05)"
      reason: "大项目投资规模大，经济可行性更重要"

# ======== 地理层级降级搜索 ========
geo_level_adaptation:
  name: "地理层级自适应降级搜索"
  description: "区级数据不足时自动降级到市级/省级"
  current_status: "已实现"
  implementation: "utils/keyword-mapping.js → expandKeywords()"

  strategy:
    - level: "区级"
      priority: 1
      keywords: "黄陂区 + 具体资源关键词"
      fallback: "市级"

    - level: "市级"
      priority: 2
      keywords: "武汉市 + 资源关键词"
      fallback: "省级"

    - level: "省级"
      priority: 3
      keywords: "湖北省 + 资源关键词"
      fallback: "全国"

  example: |
    搜索"黄陂区研学基地" → 结果不足
    → 降级为"武汉市研学基地"
    → 仍不足 → 降级为"湖北省研学基地"

# ======== 关键词扩大策略 ========
keyword_expansion:
  name: "关键词语义扩展"
  description: "核心关键词不足时自动扩展同义词/相关词"
  current_status: "已实现"
  implementation: "utils/keyword-mapping.js"

  examples:
    - input: "研学基地"
      expansions: ["营地教育", "自然教育", "研学旅行", "劳动教育", "科普基地"]

    - input: "户外营地"
      expansions: ["露营基地", "房车营地", "帐篷营地", "自驾车营地", "青少年营地"]

    - input: "乡村旅游"
      expansions: ["田园综合体", "美丽乡村", "民宿集群", "休闲农业", "农家乐"]

# ======== 历史偏好记忆（预留） ========
user_preference_memory:
  name: "用户历史偏好记忆"
  description: "记住用户上次的修正偏好，下次自动提示"
  current_status: "设计中"
