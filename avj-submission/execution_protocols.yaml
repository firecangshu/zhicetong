# execution_protocols.yaml
# 踏歌行智策通 —— 任务协议与执行流程
# 生成时间：2026-06-18
# 格式：AVJ引擎protocols标准格式，每条含title/goal/agent_actions/parameters/verification/evidence

protocols:
  - id: S1
    title: 系统启动封面
    goal: 展示项目名称与定位，渲染动态封面
    agent_actions:
      - 展示项目名称"踏歌行智策通"与副标题
      - 渲染CSS粒子动画/渐变背景
    parameters:
      - cover_style
    verification:
      - 页面加载成功
      - 标题正确渲染
    evidence: [E002]

  - id: S2
    title: 使用指南
    goal: 展示数据优先级规则和操作步骤概览
    agent_actions:
      - 展示数据优先级规则（🟦官方API > 🟩AI聚合 > 🟧人工修正）
      - 说明W1→W9流程概览
    parameters:
      - guide_language
    verification:
      - 用户可下滑查看完整指南
    evidence: [E002]

  - id: W1
    title: 身份认证
    goal: 收集项目ID，生成项目身份卡
    agent_actions:
      - 收集用户输入的项目编号
      - 生成项目身份卡（含项目ID和创建时间）
    parameters:
      - project_id_format
      - auth_timestamp
    verification:
      - 项目ID非空
      - ID格式符合规范（PROJ-YYYY-XX-NNN）
    evidence: [E002]

  - id: W2
    title: 地块框选
    goal: 获取地块地理坐标和行政区划信息
    agent_actions:
      - 获取地理坐标（用户点击地图或手动输入）
      - 查询行政区划代码和官方名称
      - 获取地形描述
    parameters:
      - geo_coord_lat
      - geo_coord_lng
      - admin_code
      - terrain_type
    verification:
      - 坐标在有效范围（中国境内）
      - 行政区划代码可解析
    evidence: [E002]

  - id: W3
    title: 资源调查
    goal: 按GB/T 18972-2017标准完成20项旅游资源调查
    agent_actions:
      - 展示8大类20项调查模板
      - 渲染数据来源标签（🟦官方/🟩AI/🟧人工）
      - 提供修正入口（用户点击修正/备注）
    parameters:
      - resource_category
      - source_type
      - manual_note
    verification:
      - 所有20项资源数据已加载
      - 来源标签正确渲染
      - 修正备注可保存
    evidence: [E003, E004]

  - id: W4
    title: 政策引导
    goal: 展示四级政策体系（国家/省/市/区），标注利好/约束方向
    agent_actions:
      - 展示四级政策卡片列表
      - 标注政策方向（绿色↑利好 / 红色↓约束）
    parameters:
      - policy_level
      - policy_direction
      - policy_keyword
    verification:
      - 四级政策均有数据
      - 方向标签正确
    evidence: [E002]

  - id: W5
    title: 市场调研
    goal: 展示PEST分析、竞品分析和市场份额图表
    agent_actions:
      - PEST分析展示（政治/经济/社会/技术四维度）
      - 竞品对比表格
      - 市场份额图表渲染
    parameters:
      - pest_dimension
      - competitor_name
      - market_share_data
    verification:
      - PEST四维度均有数据
      - 图表正确渲染
    evidence: [E002]

  - id: W6
    title: 法规红线
    goal: 展示三区三线检查项，硬过滤冲突项目
    agent_actions:
      - 展示5大检查项（生态红线/基本农田/城镇开发边界/地质灾害/文保单位）
      - 硬过滤提示（冲突项高亮+NO-GO警告）
    parameters:
      - redline_category
      - conflict_status
      - severity_level
    verification:
      - 5项检查全部完成
      - 冲突项明确标注
    evidence: [E005]

  - id: W7
    title: SWOT分析
    goal: 基于前6步数据生成SWOT矩阵和战略建议
    agent_actions:
      - 生成SWOT四象限（优势/劣势/机会/威胁）
      - 生成智能战略建议文本
    parameters:
      - swot_quadrant
      - strategy_type
    verification:
      - 四象限均有内容
    evidence: [E001, E002]

  - id: W8
    title: 需求澄清
    goal: 收集用户主观需求和补充信息
    agent_actions:
      - 收集用户填写的需求文本
      - 标注为用户主观输入（sourceType='manual'）
    parameters:
      - demand_text
      - priority_level
    verification:
      - 文本非空（可选）
    evidence: [E002]

  - id: W9
    title: 战略定位与三向成果
    goal: 汇总全流程数据执行四维评分并输出决策建议
    agent_actions:
      - 执行四维评分引擎（合规35/空间25/经济20/市场20）
      - 生成三级建议（一级宏观/二级中观/三级微观）
      - 输出结构化决策报告
    parameters:
      - compliance_weight
      - spatial_weight
      - economic_weight
      - market_weight
    verification:
      - 评分引擎输出有效（verdict ∈ {GO, PAUSE, CONDITIONAL, NO-GO}）
      - 四个维度评分均在0-100范围
      - 置信度在0-100范围
    evidence: [E001, E005]
