feedback_version: "1.1"
generated_at: "2026-06-11"
status: "protocol_defined"  # protocol_defined / partially_implemented / fully_implemented
implementation_note: "项目当前为演示/参赛阶段，反馈循环机制已设计协议，但代码尚未实现。待商业化推广后，基于真实用户使用记录逐步实现。"

# ======== 反馈循环设计 ========
feedback_loops:
  - id: FL001
    name: "决策Trace记录"
    description: "每次四维评分记录完整输入→输出→建议"
    trigger: "用户完成W9评分"
    input: "{land, resource, policy, market, redline}"
    output: "{verdict, confidence, totalScore, dimensions, suggestion}"
    storage: "wx.setStorageSync (本地存储)"
    evidence_type: "trace"
    evidence_level: "E0"
    implementation:
      status: "designed"
      file: "utils/trace.js（待创建）"
      note: "协议已设计，代码待实现。项目商业化后基于真实用户使用记录实现。"

  - id: FL002
    name: "失败样本沉淀"
    description: "verdict=NO-GO或PAUSE时自动记录为失败样本"
    trigger: "引擎输出NO-GO或PAUSE"
    input: "评分输入 + 评分结果"
    output: "失败样本记录 {timestamp, input, result, reason}"
    storage: "wx.setStorageSync"
    evidence_type: "failure_sample"
    evidence_level: "E0"
    implementation:
      status: "designed"
      file: "utils/trace.js → getFailureSamples()（待实现）"
      note: "协议已设计，代码待实现。需要真实用户使用后才能积累失败样本。"

  - id: FL003
    name: "用户修正日志"
    description: "记录用户对数据项的修正行为"
    trigger: "用户点击'修正/备注'并保存"
    input: "{field, oldValue, newValue, note}"
    output: "修正记录 {timestamp, page, field, before, after, note}"
    storage: "wx.setStorageSync"
    evidence_type: "human_correction"
    evidence_level: "E0"
    implementation:
      status: "designed"
      file: "utils/trace.js → recordEdit()（待实现）"
      note: "协议已设计，代码待实现。需要UI层调用接口，待商业化后实现。"

  - id: FL004
    name: "规则修正闭环"
    description: "基于失败样本和用户修正，定期优化评分规则"
    trigger: "积累足够样本后（>20条）"
    input: "失败样本集 + 修正日志"
    output: "规则优化建议 {rule_id, current_threshold, suggested_threshold, confidence}"
    storage: "人工审核后更新rules.json"
    evidence_type: "repair_loop"
    evidence_level: "E0"
    implementation:
      status: "designed"
      file: "utils/rules.json + 人工审核流程"
      note: "需要专家参与，当前仅设计流程"

  - id: FL005
    name: "Benchmark更新"
    description: "用新案例更新评估基准"
    trigger: "每季度或积累50个新案例"
    input: "历史trace + 新项目评分"
    output: "更新后的评分基准统计"
    storage: "云端数据库（预留）"
    evidence_type: "benchmark"
    evidence_level: "E0"
    implementation:
      status: "designed"
      file: "cloud database（预留）"
      note: "需要云开发环境，当前仅预留接口"

# ======== 经验复利路径（规划中，待商业化后实现）========
compounding_path:
