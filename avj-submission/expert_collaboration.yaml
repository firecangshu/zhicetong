# expert_collaboration.yaml
# 踏歌行智策通 —— 专家协作与知识转移机制
# 生成时间：2026-06-18
# 格式：AVJ引擎标准格式（expert_roles字符串数组+expert_review_process+knowledge_transfer_mechanism）

expert_roles:
  - 文旅规划专家
  - 户外营地/研学专家
  - 土地/规划法律顾问
  - 生态/环境专家
  - 财务投资顾问

expert_review_process: 每个项目评分完成后，由文旅规划专家审核定位结论和法律顾问审核合规评估，必要时调整评分规则和权重。审核结果沉淀为规则修正建议，经确认后更新engine.js。

knowledge_transfer_mechanism: 将专家审核后的规则修正沉淀到engine.js评分规则和rules.json参数，案例脱敏后纳入mock-data.js作为参考基准，使1位专家的经验可放大给所有用户。

