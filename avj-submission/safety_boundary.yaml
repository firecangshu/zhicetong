# safety_boundary.yaml
# 踏歌行智策通 —— 安全边界与责任声明
# 生成时间：2026-06-18
# 格式：AVJ引擎6字段+audit_logs+evidence标准格式

not_do:
  - 不替代法律意见、合规判断（土地性质判定、合规手续办理、法律风险评估）
  - 不做金融投资决策（投资回报预估仅供参考，不可作为投资决策唯一依据）
  - 不处理敏感个人信息（不收集个人身份信息、精确位置轨迹、通讯录）
  - 不替代工程勘察（地质灾害评估、水文地质调查、工程可行性）
  - 不自动触发行政审批（用地审批、环评批复、施工许可）

human_review_required:
  - 生态保护红线冲突时必须人工联系当地自然资源局核实
  - 永久基本农田占用时禁止开发，建议调整选址
  - 文保单位影响范围需联系文旅局/文物局评估建设控制地带
  - 地质灾害风险需委托具备资质的勘察单位出具专项评估报告
  - 投资回报周期超过6年需财务顾问介入重新测算

data_handling:
  - 仅收集项目ID（用户输入）、地块坐标（用户框选）、用户修正备注（用户主动填写）
  - 不收集个人身份信息和精确位置轨迹
  - 数据本地存储（wx.setStorageSync），不上传服务器
  - 未来接入腾讯地图API时坐标数据发送至腾讯位置服务，需单独获取用户明示同意

consent_or_authorization:
  - 用户主动输入项目ID和地块信息视为授权使用
  - 修正备注由用户主动填写并确认后保存
  - 未来接入真实API时需单独获取用户明示同意

risk_scenarios:
  - 生态红线冲突→项目被叫停→投资损失
  - 基本农田占用→违法用地→行政处罚
  - AI聚合数据偏差→选址评估失准→投资误判
  - 政策变动→合规评估过时→风险遗漏
  - 地质灾害未识别→安全事故→人身财产损失

audit_logs: false   # MVP阶段未实现审计日志系统

fallback_plan: 评分引擎异常时返回默认PAUSE结论并提示用户人工复核；API不可用时降级到mock数据并标注"离线模式"提示。

evidence: [E001, E005]
