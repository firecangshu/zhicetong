# ======== 问题背景 ========
problem_statement: |
  中国文旅产业近年来快速发展，但存在以下问题：
  1. 项目选址缺乏科学依据，依赖经验判断
  2. 生态红线、基本农田冲突频发，导致项目被叫停
  3. 投资回报预估偏差大，大量项目亏损
  4. 地方政府招商时缺乏标准化筛选工具

  据统计，约30%的文旅项目因选址不当或合规问题
  在建设阶段被叫停或建成后亏损（数据来源：待补充）。

