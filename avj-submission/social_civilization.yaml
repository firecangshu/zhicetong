# social_civilization.yaml
# 踏歌行智策通 —— 社会-文明价值说明
# 生成时间：2026-06-18
# 格式：AVJ引擎标准格式（claimed_level+beneficiaries+evidence等）

claimed_level: 3
beneficiaries:
  - 文旅项目投资者和开发者
  - 地方政府文旅部门
  - 乡村社区和生态保护区
  - 户外营地和研学基地运营者
unmet_need_severity: 文旅项目因选址不当导致约30%项目被叫停或亏损，生态红线冲突频发，地方政府缺乏标准化筛选工具，中小投资者无力承担高昂咨询费用。
long_term_capability_impact: 将专家选址经验固化为可执行引擎，降低违规投资风险，保护生态红线区域，促进文旅产业与生态保护协调发展。
externalities: 减少违规投资造成的社会资源浪费，降低生态破坏风险，提高土地利用效率，辅助地方政府科学招商。
ability_propagation: 将1位文旅规划专家的选址经验通过系统放大给100+用户，降低专业门槛，让中小投资者也能做初步选址评估。
evidence: [E001, E005]
