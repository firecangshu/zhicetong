# open_source_provenance.yaml
# 踏歌行智策通 —— 开源来源与团队增量声明
# 生成时间：2026-06-18
# 格式：AVJ引擎标准格式（upstreams/team_delta/originality_statement）

upstreams:
  - name: "微信小程序原生框架"
    type: "平台SDK"
    license: "微信开放平台服务协议"
    usage: "小程序页面渲染、组件系统、生命周期管理"
  - name: "微信内置Map组件"
    type: "平台组件"
    license: "微信开放平台服务协议"
    usage: "W2页面地图展示（当前为虚拟占位）"
  - name: "GB/T 18972-2017"
    type: "国家标准"
    license: "公开标准"
    usage: "W3资源调查的分类框架（8主类23亚类）"

team_delta:
  code:
    - 四维决策引擎（utils/engine.js，16条领域规则+4条决策规则）
    - SOP九步选址流程（pages/w1-land/ → pages/w9-result/，13个页面）
    - 三层数据溯源体系（utils/mock-data.js，{value,sourceType,sourceName,manualNote}结构）
    - 关键词映射体系（utils/keyword-mapping.js，20+关键词映射规则）
  domain_rules:
    - 生态红线硬过滤规则（-30分一票否决）
    - 基本农田冲突否决规则（-20分硬过滤）
    - 四维权重评分规则（合规35/空间25/经济20/市场20）
    - 地理降级搜索策略（村→街道→区县→城市逐级扩展）
  validation:
    - 微信开发者工具运行验证
    - 模拟数据全流程测试
  data:
    - 模拟地块数据（含溯源标注，3级来源分类）
    - GB/T 18972-2017资源调查模板（20项可勾选调查清单）
  workflow:
    - W1-W9九步标准化选址流程（含S1-S4引导页）
  safety:
    - 红线一票否决机制
    - 不替代法律意见、金融决策的边界声明
    - 用户修正备注机制（manualNote）

originality_statement: |
  本项目基于微信小程序原生框架开发，核心算法（四维评分引擎）、
  业务流程（SOP九步选址）、数据架构（三层数据溯源）均为团队自主研发。
  上游依赖仅限于平台SDK和国标引用，不存在大量复用开源项目代码的情况。
  所有业务逻辑和领域规则源于10年文旅规划实践经验的系统化沉淀。
