# domain_prior_ledger.yaml
# 踏歌行智策通 —— 领域先验沉淀清单
# 生成时间：2026-06-18
# 格式：AVJ引擎priors标准格式（domain_prior.schema.json）
# 来源：10年文旅规划实践经验 → 四维引擎规则系统化沉淀

priors:
  - id: P001
    statement: 生态红线冲突的文旅项目必须一票否决，不可通过降分处理。生态保护红线区域内禁止任何与保护功能无关的建设活动。
    source_type: literature
    rarity: 4
    practicality: 5
    actionability: 5
    reusability: 5
    how_it_changes_agent_behavior: 引擎在evaluateCompliance()中对红线冲突项目直接扣30分并输出NO-GO，不提供"低分通过"选项，确保合规底线不可逾越。
    evidence: [E001, E005]

  - id: P002
    statement: 永久基本农田不可用于文旅开发，农用地转用审批周期长（通常2-3年）、成功率低，应在选址初期即排除。
    source_type: literature
    rarity: 3
    practicality: 5
    actionability: 5
    reusability: 5
    how_it_changes_agent_behavior: 引擎对基本农田冲突项目扣20分，合规分降至50以下，输出PAUSE或NO-GO，并建议调整选址或申请土地性质变更（标注程序复杂）。
    evidence: [E001, E005]

  - id: P003
    statement: 文旅项目选址应优先评估合规维度（权重35%），其次空间（25%）、经济（20%）、市场（20%）。合规维度的否决权高于其他维度的加分。
    source_type: expert_practice
    rarity: 5
    practicality: 5
    actionability: 5
    reusability: 5
    how_it_changes_agent_behavior: 引擎按合规35/空间25/经济20/市场20的固定权重计算综合评分，合规维度得分低于30分时直接输出NO-GO，其他维度无法通过加分弥补。
    evidence: [E001]

  - id: P004
    statement: 岗丘-林-田-塘复合景观肌理具备内容差异化优势，适合低冲击文旅开发。单一地貌类型的文旅项目缺乏体验层次感。
    source_type: expert_practice
    rarity: 5
    practicality: 4
    actionability: 4
    reusability: 3
    how_it_changes_agent_behavior: 引擎对复合景观类型地块的空间维度评分+10分，在战略建议中提示"复合景观具备内容差异化优势，建议低冲击开发"。
    evidence: [E001]

  - id: P005
    statement: 近郊1-2小时车程圈内的文旅项目具备客流稳定性优势，投资回报周期通常比远郊项目短2-3年。
    source_type: expert_practice
    rarity: 3
    practicality: 5
    actionability: 5
    reusability: 4
    how_it_changes_agent_behavior: 引擎对近郊区位项目经济维度+15分，并在战略建议中提示"近郊高频消费圈具备客流稳定性"，同时提示市场竞争风险需同步评估。
    evidence: [E001]

  - id: P006
    statement: 研学旅行需求持续增长且受政策支持，B2B渠道优先布局可降低获客成本。但研学基地需满足教育部安全标准。
    source_type: literature
    rarity: 3
    practicality: 4
    actionability: 4
    reusability: 4
    how_it_changes_agent_behavior: 引擎对研学需求项目市场维度+10分，并在战略建议中提示"B2B渠道策略优先"，同时在安全维度标注研学安全标准要求。
    evidence: [E001, E005]

  - id: P007
    statement: 文旅项目投资回报周期超过6年时，现金流风险显著增加，需引入财务顾问重新测算。行业标准健康回报周期为4-5年。
    source_type: expert_practice
    rarity: 3
    practicality: 5
    actionability: 5
    reusability: 5
    how_it_changes_agent_behavior: 引擎对回报周期5-6年项目经济维度扣10分，超过6年时在安全边界中触发"需财务顾问介入"的人工复核条件。
    evidence: [E001]

  - id: P008
    statement: 文旅选址涉及的数据来源可信度差异巨大：官方API数据>AI聚合数据>人工输入数据。任何数据项都必须标注来源类型，否则用户无法判断决策依据的可靠性。
    source_type: expert_practice
    rarity: 5
    practicality: 5
    actionability: 5
    reusability: 4
    how_it_changes_agent_behavior: 引擎强制所有数据项遵循{value, sourceType, sourceName, manualNote}统一结构，UI层按sourceType渲染不同颜色标签（🟦官方/🟩AI/🟧人工），未标注来源的数据项不可参与评分。
    evidence: [E003]

  - id: P009
    statement: 政策数据应按级别分类（国家级/部委级/省级/市级/区县级），不同级别政策的约束力和适用范围不同。国家级和部委级政策具有普遍约束力，地方政策仅适用于特定行政区域。
    source_type: literature
    rarity: 4
    practicality: 4
    actionability: 4
    reusability: 4
    how_it_changes_agent_behavior: 引擎在政策维度评估中按政策级别赋予不同权重（国家级>部委级>省级>市级），地方政策仅在对应行政区域内生效，搜索关键词不包含地名以避免双重地名错误。
    evidence: [E001]

  - id: P010
    statement: 地理搜索结果不足时（<3条），应逐级扩大搜索范围：村→街道→区县→城市，而非直接跳到全国范围。直接跳级会导致搜索结果与地块关联性过低。
    source_type: expert_practice
    rarity: 5
    practicality: 4
    actionability: 4
    reusability: 4
    how_it_changes_agent_behavior: 引擎在数据搜索时自动执行地理降级策略，搜索结果<3条时从当前行政级别逐级向上扩展，而非直接使用全国范围关键词，确保搜索结果与地块保持地理关联性。
    evidence: [E001, E003]
